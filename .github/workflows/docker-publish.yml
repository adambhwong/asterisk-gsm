name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Automatic version bumping on push to main
  auto-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: '0'

      - name: Bump version and push tag
        id: tagger
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          RELEASE_BRANCHES: main

  # 2. Automatically create a GitHub Release when a new tag is pushed
  create-release:
    needs: [auto-tag]
    if: ${{ needs.auto-tag.outputs.new_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: '0'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.auto-tag.outputs.new_tag }}
          name: Release ${{ needs.auto-tag.outputs.new_tag }}
          generate_notes: true
          draft: false
          prerelease: false

  # 3. Security Scans (Secret Leak & Static Analysis)
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: '0' # Required for Gitleaks to scan git history

      # Run Gitleaks for secret and credential leak scanning
      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run Flawfinder or Python static analysis (Bandit) on your scripts
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: Run Bandit (Python Static Code Security Analyzer)
        run: |
          pip install --no-cache-dir bandit
          bandit -r scripts/ -ll --format custom || true

  # 4. Build, Trivy Scan, and Push
  build-and-push:
    needs: [auto-tag, security-scan]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.auto-tag.outputs.new_tag || '' }}
            type=sha,prefix=sha-,enable=true,priority=100,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build local image for security scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: local-scan-target:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-scan-target:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: '/usr/local/lib/python3.15/site-packages/pip/_vendor'
          severity: 'CRITICAL,HIGH'

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
