name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Automatically bumps version and creates a Git tag on push to main
  auto-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Bump version and push tag
        id: tagger
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V_PREFIX: true
          RELEASE_BRANCHES: main

  build-and-push:
    needs: [auto-tag]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Allows uploading SARIF reports to GitHub Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=true,priority=100,format=short

      # Step 1: Build the image locally into Docker engine so Trivy can scan it
      - name: Build local image for security scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: local-scan-target:${{ github.sha }}

      # Step 2: Scan the built image for vulnerabilities using Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-scan-target:${{ github.sha }}
          format: 'table'
          exit-code: '1'             # Fails the pipeline step if vulnerabilities are found
          ignore-unfixed: true      # Excludes vulnerabilities that have no official patch yet
          # Skip scanning python-pkg to prevent flagging vendored setuptools internals
          skip-dirs: '/usr/local/lib/python3.15/site-packages/setuptools/_vendor'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Step 3: Push to registry only after passing the scan
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
